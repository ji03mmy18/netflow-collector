# ── 資料庫連線 ───────────────────────────────────────────────────────────────
# --db-store / --migrate / --recompute-* 都需要這個區段。
[database]
host = "localhost"
port = 5432
user = "netflow"
password = "netflow-local-dev"
dbname = "netflow"

# ── NetFlow 語意 ─────────────────────────────────────────────────────────────
[netflow]
# 內網網段：區分 intra_*（範圍內）與 ext_*（範圍外）的邊界。
# --db-store 與 --recompute-5m 都從這裡讀，所以重算時的分類方式一定與
# 當初收集時一致。
#
# ⚠ 改動這個值會讓 intra_*/ext_* 的語意從那一刻起改變，而統計表沒有任何
#    欄位記錄它是用哪個網段算出來的。collector 會把實際使用的值寫進
#    app_config.intra_cidr_last_used，改動時在啟動 log 發出警告。
intra_cidr = "10.10.0.0/16"

# 採樣還原倍率。Cisco 在部分平台不會正確填 v5 header 的該欄位，所以這裡是
# 設定值而非讀封包。未開採樣時填 1。
sampling_interval = 1

# exporter 時鐘看門狗。ts 由封包換算，等於信任交換器的 NTP；當
# |received_at - ts| 超過這個秒數時，該筆改用 collector 的收包時間，
# 並記入 collector_health_1m.clock_skew_rejects。
# active/inactive timeout 皆為 1 秒時，正常偏差是 0~2 秒的窄帶，
# 所以 60 秒有極大的餘裕，只會攔到真正壞掉的時鐘。
clock_skew_threshold_seconds = 60

# ── 統計寫出 ─────────────────────────────────────────────────────────────────
[stats]
# 記憶體中的桶增量多久寫出一次。這與 5 分鐘的桶寬是兩件獨立的事：
# 桶寬決定曲線解析度（資料模型），寫出頻率決定查詢新鮮度與崩潰暴露面
# （運維）。60 秒不會增加任何儲存成本——同一列只是被更新 5 次而非 1 次。
flush_seconds = 60

# ── 常用 Port（--color 標亮綠） ──────────────────────────────────────────────
[highlighted_ports]
# "extend"（預設）= 在內建清單上新增；"override" = 完全取代內建清單
mode = "extend"
ports = []

# ── --live 畫面 ──────────────────────────────────────────────────────────────
[live]
lines = 10

# ── IP 過濾清單 ──────────────────────────────────────────────────────────────
#
# 這是唯一一份 IP 清單，同時決定三件事：
#   1. --direct-print / --live 顯示哪些
#   2. 哪些 flow 會被寫入 flow_raw
#   3. 統計算在誰頭上（來源命中 → 該位址的 tx；目標命中 → 該位址的 rx）
#
# 支援單一位址與 CIDR 網段。
#
# direction: "any"（預設）來源或目標任一符合即可
#            "src"  只比對來源——該位址只會被計入發送量
#            "dst"  只比對目標——該位址只會被計入接收量
#
# ⚠ 用於流量統計時請用 "any"。被監控主機傳給一個未列入清單的內網位址，
#    那筆流量仍要算進它的 intra_tx；限定成 "src"/"dst" 會讓另一半消失，
#    而且 ext_* 的數字看起來完全正常，報表上察覺不到。
#
# 清單很長時可以直接寫在這裡，或用任何腳本產生這一段。
[[filters]]
cidr = "192.168.11.118"
direction = "dst"

[[filters]]
cidr = "192.168.11.200"
direction = "dst"

[[filters]]
cidr = "192.168.11.196"
direction = "any"
